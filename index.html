<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nilayan Chatterjee — Portfolio</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231A1D1C'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='%23F9F8F5' font-family='Plus Jakarta Sans, sans-serif' font-weight='800' font-size='13'>NC</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,600;1,800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            linen: '#F9F8F5',
            warmCard: '#F2EFEB',
            sandBorder: '#E5DFD7',
            sageAccent: '#5A6E68',
            softOlive: '#767F74',
            darkCharcoal: '#1A1D1C',
            mutedBrown: '#8B7A70',
            darkBg: '#121514',
            darkCard: '#1B201E',
            darkBorder: '#2A322F',
            darkText: '#E6E8E5',
            darkMuted: '#9FA8A3',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F9F8F5;
      color: #1A1D1C;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .dark body {
      background-color: #121514;
      color: #E6E8E5;
    }

    /* Theme Toggle Button Styles */
    .icon-button {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      background-color: #F2EFEB;
      border: 1px solid #E5DFD7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1A1D1C;
    }
    .dark .icon-button {
      background-color: #1B201E;
      border-color: #2A322F;
      color: #E6E8E5;
    }
    .icon-button:hover {
      transform: scale(1.08);
      border-color: #5A6E68;
    }
    .icon-button .icon {
      width: 18px;
      height: 18px;
    }
    .icon-button .icon--sun { display: none; }
    .icon-button .icon--moon { display: block; }
    .dark .icon-button .icon--sun { display: block; }
    .dark .icon-button .icon--moon { display: none; }
  </style>
</head>
<body class="antialiased transition-colors duration-400">

  <!-- Header matching target layout -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-[#F9F8F5]/85 dark:bg-[#121514]/85 backdrop-blur-md border-b border-sandBorder dark:border-[#2A322F] transition-all duration-300">
    <div class="max-w-5xl mx-auto px-6 py-3.5 flex items-center justify-between">
      
      <!-- Name Brand -->
      <a href="#intro" class="font-extrabold text-lg text-darkCharcoal dark:text-[#E6E8E5]">
        Nilayan Chatterjee<span class="text-sageAccent">.</span>
      </a>

      <!-- Navigation Links & Theme Button -->
      <div class="flex items-center space-x-6">
        <nav class="hidden md:flex items-center space-x-6 text-[11px] uppercase tracking-[0.18em] font-semibold text-softOlive dark:text-[#9FA8A3]">
          <a href="#work" class="hover:text-darkCharcoal dark:hover:text-[#E6E8E5] transition-colors">Experience</a>
          <a href="#disciplines" class="hover:text-darkCharcoal dark:hover:text-[#E6E8E5] transition-colors">Skills</a>
          <a href="#pedigree" class="hover:text-darkCharcoal dark:hover:text-[#E6E8E5] transition-colors">Education</a>
          <a href="#footer" class="hover:text-darkCharcoal dark:hover:text-[#E6E8E5] transition-colors">Contact</a>
        </nav>

        <!-- Working Theme Toggle Button -->
        <button class="icon-button" type="button" aria-label="Switch theme" data-theme-toggle>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.7 5.7l1.4 1.4M16.9 16.9l1.4 1.4M18.3 5.7l-1.4 1.4M7.1 16.9l-1.4 1.4"></path>
          </svg>
        </button>

        <!-- Résumé Pill Button -->
        <a href="mailto:nilayancworks@gmail.com" class="bg-darkCharcoal dark:bg-linen text-linen dark:text-darkCharcoal px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider hover:opacity-90 transition-opacity">
          Résumé
        </a>
      </div>

    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 pt-32">
    <section id="intro" class="py-20">
      <h1 class="text-4xl font-extrabold">Portfolio Content Area</h1>
    </section>
  </main>

  <script>
    // Robust Theme Toggle Handler
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.querySelector('[data-theme-toggle]');
      
      // Initialize theme from storage or system preference
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Bind click event
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      }
    });
  </script>
</body>
</html>
